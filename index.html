<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Sofyan Bet — پلتفرم جامع کازینو و پیش‌بینی ورزشی</title>
  <style>
    :root {
      --bg-base: #070b12;
      --bg-elev-1: #0e1522;
      --bg-elev-2: #151f32;
      --bg-elev-3: #1d2b45;
      --border: rgba(148, 163, 184, 0.15);
      --border-strong: rgba(16, 185, 129, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent: #10b981;
      --accent-hover: #059669;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --blue: #38bdf8;
      --blue-soft: rgba(56, 189, 248, 0.14);
      --gold: #f59e0b;
      --gold-soft: rgba(245, 158, 11, 0.15);
      --danger: #ef4444;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      max-width: 100vw;
      background: radial-gradient(circle at 20% 0%, #10203a 0%, var(--bg-base) 52%, #05080d 100%);
      color: var(--text-main);
      font-family: "Vazirmatn", "IRANSans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.55;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
      max-width: 100%;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      transition: transform 0.12s ease, background-color 0.16s ease, border-color 0.16s ease, opacity 0.16s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    input, select, textarea {
      background: var(--bg-base);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.9rem;
      outline: none;
      width: 100%;
      min-width: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      direction: ltr;
      unicode-bidi: isolate;
    }

    /* Entry Gate (Auth First) */
    .entry-gate {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background:
        radial-gradient(circle at 15% 15%, rgba(16, 185, 129, 0.16), transparent 42%),
        radial-gradient(circle at 85% 10%, rgba(56, 189, 248, 0.14), transparent 45%),
        var(--bg-base);
    }

    .entry-gate.hidden {
      display: none;
    }

    .auth-box {
      width: 100%;
      max-width: 440px;
      background: rgba(14, 21, 34, 0.95);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 800;
      font-size: 1.12rem;
      white-space: nowrap;
    }

    .brand-badge {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--blue));
      display: grid;
      place-items: center;
      color: #03130d;
      font-weight: 900;
      font-size: 1rem;
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.35);
    }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: var(--bg-base);
      padding: 5px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .auth-tab {
      padding: 9px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .auth-tab.active {
      background: var(--accent);
      color: #03150e;
    }

    /* Main App Shell (Hidden until authenticated) */
    .app-shell {
      display: none;
      grid-template-areas:
        "header header"
        "sidebar main";
      grid-template-columns: 245px minmax(0, 1fr);
      grid-template-rows: 66px minmax(calc(100vh - 66px), 1fr);
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
    }

    .app-shell.active {
      display: grid;
    }

    .app-shell.active.chat-open {
      grid-template-areas:
        "header header header"
        "sidebar main chat";
      grid-template-columns: 235px minmax(0, 1fr) 310px;
    }

    .topbar {
      grid-area: header;
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 16px;
      min-height: 66px;
      background: rgba(9, 14, 24, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      width: 100%;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .wallet-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      padding: 4px 8px 4px 10px;
      border-radius: var(--radius-md);
      min-width: 0;
    }

    .wallet-bar select {
      padding: 5px 7px;
      font-size: 0.8rem;
      background: var(--bg-elev-1);
      width: auto;
    }

    .balance-readout {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--accent);
      white-space: nowrap;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: #03150e;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #ecfdf5;
    }

    .btn-blue {
      background: var(--blue);
      color: #041322;
    }

    .btn-gold {
      background: var(--gold);
      color: #1c1100;
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .btn-ghost {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-main);
    }

    .btn-ghost:hover:not(:disabled) {
      border-color: var(--border-strong);
      background: var(--bg-elev-3);
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 0.78rem;
      border-radius: 7px;
    }

    .sidebar {
      grid-area: sidebar;
      background: rgba(11, 17, 30, 0.96);
      border-left: 1px solid var(--border);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
    }

    .nav-group-title {
      font-size: 0.74rem;
      color: var(--text-dim);
      font-weight: 700;
      padding: 0 8px;
      margin-bottom: 6px;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 11px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: right;
    }

    .nav-item:hover {
      background: var(--bg-elev-2);
      color: var(--text-main);
    }

    .nav-item.active {
      background: linear-gradient(90deg, rgba(16, 185, 129, 0.18), rgba(56, 189, 248, 0.08));
      color: var(--text-main);
      border: 1px solid rgba(16, 185, 129, 0.35);
      font-weight: 700;
    }

    .nav-tag {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--bg-elev-3);
      color: var(--blue);
    }

    .nav-tag.live {
      background: var(--danger-soft);
      color: #fca5a5;
    }

    .sidebar-card {
      margin-top: auto;
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .main-area {
      grid-area: main;
      padding: 18px;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .view-section {
      display: none;
      flex-direction: column;
      gap: 16px;
      min-width: 0;
    }

    .view-section.active {
      display: flex;
    }

    .hero-banner {
      background: linear-gradient(125deg, rgba(16, 185, 129, 0.16), rgba(56, 189, 248, 0.12) 60%, rgba(245, 158, 11, 0.1));
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }

    .hero-title {
      font-size: 1.24rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .hero-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      max-width: 680px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .section-title {
      font-size: 1.04rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      white-space: nowrap;
    }

    .pill.active {
      background: var(--accent);
      color: #03150e;
      border-color: var(--accent);
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 12px;
    }

    .game-card {
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 13px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .game-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .game-icon {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
    }

    .game-edge {
      font-size: 0.7rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    .game-name {
      font-weight: 700;
      font-size: 0.94rem;
    }

    .game-desc {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .cabinet-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 14px;
      background: var(--bg-elev-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }

    .controls-panel {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-width: 0;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
