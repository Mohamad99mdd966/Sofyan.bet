<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>صوفیان بت | Sofyan.bet — کازینو اورجینال و پیش‌بینی ورزشی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-base: #07090e;
      --bg-surface: #0e121b;
      --bg-elevated: #141a26;
      --bg-card: #111622;
      --bg-input: #0a0d14;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text-main: #f3f6fc;
      --text-muted: #8b95a9;
      --text-dim: #5d677a;
      --gold: #f5b935;
      --gold-2: #d98e14;
      --gold-soft: rgba(245, 185, 53, 0.14);
      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --rose: #f43f5e;
      --rose-soft: rgba(244, 63, 94, 0.14);
      --cyan: #22d3ee;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Vazirmatn", system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, rgba(245, 185, 53, 0.08), transparent 36%),
        radial-gradient(circle at 85% 10%, rgba(34, 211, 238, 0.06), transparent 34%),
        var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.65;
      overflow-x: hidden;
    }

    button, input, select, textarea {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: transparent;
      transition: transform 0.14s ease, background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.48;
      cursor: not-allowed;
    }

    input, select, textarea {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(245, 185, 53, 0.14);
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      direction: ltr;
      unicode-bidi: isolate;
    }

    .num {
      font-variant-numeric: tabular-nums;
    }

    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 268px;
      flex-shrink: 0;
      background: rgba(14, 18, 27, 0.94);
      border-left: 1px solid var(--border);
      backdrop-filter: blur(18px);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      transition: transform 0.25s ease;
    }

    .brand {
      padding: 20px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--gold), var(--gold-2));
      color: #0b0e14;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: 1.25rem;
      box-shadow: 0 8px 24px rgba(245, 185, 53, 0.28);
      flex-shrink: 0;
    }

    .brand-name {
      font-weight: 900;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-tag {
      font-size: 0.72rem;
      color: var(--gold);
      background: var(--gold-soft);
      padding: 1px 7px;
      border-radius: 999px;
      font-weight: 700;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
    }

    .nav-group-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-dim);
      padding: 10px 10px 6px;
    }

    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
